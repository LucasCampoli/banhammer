# Ablation step 7: the decomposition with a stronger model, without the type and mana value filter.
# Measured on the gold set counterparts alone, gpt-5.4-mini placed more combo pieces in the top 10
# than gpt-4o-mini, and the filter dropped pieces whenever the counterpart's type was guessed
# wrong. Only the decomposition uses decompose_llm; the judge keeps llm and sees 5 cards.
# gpt-5.4-mini is a reasoning model: it takes reasoning_effort instead of temperature and costs
# about 30x more per card than gpt-4o-mini (one call per card).
llm:
  model: gpt-4o-mini
  temperature: 0
decompose_llm:
  model: gpt-5.4-mini
  reasoning_effort: low
embeddings:
  model: text-embedding-3-small
k: 10
format_filter: true
decompose: true
hybrid: true
context_cards: 5    # cards the judge sees, in fused order
