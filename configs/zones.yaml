# Zone boxes as fractions of the normalized 672x936 card: [x0, y0, x1, y1]
# Calibrate with: python -m banhammer.ocr card.jpg --debug  (see overlay.png)
frame: [672, 936]
# name and mana_cost share the title bar: the name is cut where the mana cost starts.
# type_line and set_symbol share the type bar: words centered on the set symbol are dropped.
zones:
  name:           [0.075, 0.050, 0.955, 0.100]
  mana_cost:      [0.400, 0.048, 0.955, 0.102]
  type_line:      [0.085, 0.565, 0.940, 0.612]
  set_symbol:     [0.860, 0.565, 0.940, 0.612]
  rules_text:     [0.075, 0.625, 0.925, 0.925]
  power_toughness: [0.765, 0.885, 0.945, 0.945]
