# Offline data sources and the Pinecone index they are written to.
# The embedding model here must match configs/pipeline.yaml: vectors from
# different models cannot be compared, and the index name includes the model.
sources:
  - scryfall_cards
  - comp_rules
raw_dir: data/raw
processed_dir: data/processed
embeddings:
  model: text-embedding-3-small
index:
  cloud: aws
  region: us-east-1
  metric: cosine
  dimension: 1536
  batch_size: 100
