# Version 1: whole card text, dense retrieval restricted to the audited format,
# drop the card itself, then the LLM report with strict citations.
# The embedding model must match configs/ingest.yaml.
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0
embeddings:
  provider: openai
  model: text-embedding-3-small
vector_store:
  provider: pinecone
k: 10
format_filter: true   # search only cards legal or banned in the audited format
