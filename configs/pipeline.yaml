# Naive RAG: full card text, dense retrieval, drop the card itself, LLM judge.
# The embedding model must match configs/ingest.yaml.
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0
embeddings:
  provider: openai
  model: text-embedding-3-small
vector_store:
  provider: pinecone
pipeline:
  build_query: [full_text]
  retrieve:
    - name: dense
      k: 10
  filter: [exclude_self]
  generate: llm_judge
